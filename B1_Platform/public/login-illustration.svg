<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" fill="none" role="img" aria-label="高校实践教学场景插画">
  <title>衡迹 · 实践教学插画</title>

  <!-- background silhouettes -->
  <rect width="560" height="640" fill="#2748C4"/>
  <rect x="72" y="88" width="96" height="128" rx="8" fill="#1E3FA8" opacity="0.55"/>
  <rect x="184" y="72" width="112" height="144" rx="8" fill="#1E3FA8" opacity="0.45"/>
  <rect x="312" y="96" width="88" height="120" rx="8" fill="#1E3FA8" opacity="0.4"/>
  <circle cx="420" cy="420" r="72" fill="#1E3FA8" opacity="0.25"/>
  <path d="M48 520 C120 480 200 500 280 470 C360 440 430 460 512 430 L512 640 L48 640 Z" fill="#1E3FA8" opacity="0.35"/>

  <!-- plant -->
  <path d="M108 470 C108 430 88 410 88 378 C108 392 118 408 124 430 C130 408 142 388 162 372 C150 404 138 430 132 470 Z" fill="#00B96B" opacity="0.85"/>
  <rect x="118" y="470" width="18" height="34" rx="4" fill="#16357A"/>

  <!-- desk -->
  <rect x="156" y="430" width="248" height="18" rx="6" fill="#16357A"/>
  <rect x="176" y="448" width="16" height="56" rx="4" fill="#16357A"/>
  <rect x="368" y="448" width="16" height="56" rx="4" fill="#16357A"/>

  <!-- laptop -->
  <rect x="228" y="388" width="112" height="72" rx="8" fill="#F5F7FA"/>
  <rect x="236" y="396" width="96" height="52" rx="4" fill="#E6F4FF"/>
  <path d="M220 460 H348 L338 472 H230 Z" fill="#DCE7F7"/>
  <rect x="248" y="408" width="36" height="6" rx="2" fill="#1677FF" opacity="0.7"/>
  <rect x="248" y="420" width="56" height="4" rx="2" fill="#91CAFF"/>
  <rect x="248" y="430" width="44" height="4" rx="2" fill="#91CAFF"/>

  <!-- student -->
  <circle cx="286" cy="318" r="34" fill="#F4C9A8"/>
  <path d="M252 318 C252 286 266 264 286 264 C306 264 320 286 320 318" fill="#1F2937"/>
  <path d="M248 360 C260 344 272 336 286 336 C300 336 312 344 324 360 L334 430 L238 430 Z" fill="#FAAD14"/>
  <path d="M248 378 L222 418 L238 424 L252 392 Z" fill="#FAAD14"/>
  <path d="M324 378 L350 418 L334 424 L320 392 Z" fill="#FAAD14"/>
  <rect x="268" y="430" width="36" height="74" rx="10" fill="#16357A"/>
  <rect x="262" y="500" width="22" height="12" rx="4" fill="#0B3A5C"/>
  <rect x="288" y="500" width="22" height="12" rx="4" fill="#0B3A5C"/>

  <!-- report / growth card -->
  <rect x="96" y="332" width="88" height="104" rx="12" fill="#F5F7FA" transform="rotate(-8 140 384)"/>
  <rect x="108" y="352" width="44" height="6" rx="2" fill="#1677FF" transform="rotate(-8 130 355)"/>
  <path d="M112 392 L128 372 L144 382 L160 360" stroke="#00B96B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 136 376)"/>

  <!-- ai badge -->
  <circle cx="392" cy="292" r="28" fill="#722ED1" opacity="0.92"/>
  <path d="M382 292 H402 M392 282 V302" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="392" cy="292" r="8" fill="#fff" opacity="0.25"/>

  <!-- sparkles -->
  <circle cx="180" cy="250" r="4" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="360" cy="220" r="3" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="420" cy="320" r="5" fill="#FFFFFF" opacity="0.35"/>
  <path d="M148 300 L152 308 L160 310 L152 312 L148 320 L144 312 L136 310 L144 308 Z" fill="#FAAD14" opacity="0.85"/>
